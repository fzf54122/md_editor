name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtwebengine5-dev qtwebengine5-dev-tools libqt5webchannel5-dev imagemagick

      - name: Convert icon svg -> png -> ico
        run: |
          mkdir -p src/resources
          convert src/resources/icon.svg src/resources/icon.png
          convert src/resources/icon.svg src/resources/icon.ico || true

      - name: Build and package (deb)
        run: |
          bash scripts/build.sh build

      - name: Create Release (deb)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}