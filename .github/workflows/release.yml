name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtwebengine5-dev qtwebengine5-dev-tools libqt5webchannel5-dev imagemagick

      - name: Convert icon svg -> png -> ico
        run: |
          mkdir -p src/resources
          convert src/resources/icon.svg src/resources/icon.png
          convert src/resources/icon.svg src/resources/icon.ico || true

      - name: Build and package (deb)
        run: |
          bash scripts/build.sh build

      - name: Create Release (deb)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt via aqt (win64_mingw81, WebEngine)
        shell: pwsh
        env:
          QT_VERSION: 5.15.2
          QT_ARCH: win64_mingw81
        run: |
          echo "Upgrading pip..."
          python -m pip install --upgrade pip
          
          echo "Installing aqtinstall..."
          python -m pip install aqtinstall
          
          echo "Installing Qt..."
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --modules qtwebengine -O $env:GITHUB_WORKSPACE/qt
          
          # Verify Qt installation
          if (Test-Path "$env:GITHUB_WORKSPACE/qt") {
              Write-Host "Qt installation was successful"
          } else {
              Write-Host "Qt installation failed"
              exit 1
          }

          $qtCmake = "$env:GITHUB_WORKSPACE/qt/$env:QT_VERSION/mingw81_64/lib/cmake/Qt5"
          $qtPrefix = "$env:GITHUB_WORKSPACE/qt/$env:QT_VERSION/mingw81_64/lib/cmake"
          $qtBin = "$env:GITHUB_WORKSPACE/qt/$env:QT_VERSION/mingw81_64/bin"
          
          echo "Qt5_DIR=$qtCmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CMAKE_PREFIX_PATH=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "QT_BIN=$qtBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-librsvg
          update: true

      - name: Ensure icon.ico
        run: |
          echo "Checking if icon.svg exists..."
          cd ${GITHUB_WORKSPACE}
          if [ ! -f src/resources/icon.svg ]; then
            echo "icon.svg is missing!"
            exit 1
          fi

          echo "Converting icon.svg to icon.ico..."
          if [ ! -f src/resources/icon.ico ]; then
            magick src/resources/icon.svg src/resources/icon.ico
          fi

      - name: Build and package (NSIS)
        run: |
          echo "Starting build process..."
          cd ${GITHUB_WORKSPACE}
          QT_ROOT_WIN="${GITHUB_WORKSPACE}/qt/5.15.2/mingw81_64"
          QT_ROOT_MSYS=$(cygpath -u "$QT_ROOT_WIN")
          
          echo "Setting up environment variables..."
          export PATH="/mingw64/bin:${QT_ROOT_MSYS}/bin:$PATH"
          export CMAKE_PREFIX_PATH="${QT_ROOT_MSYS}/lib/cmake"
          export Qt5_DIR="${QT_ROOT_MSYS}/lib/cmake/Qt5"
          export GENERATOR="Ninja"
          
          echo "Running build script..."
          bash scripts/build.sh build

      - name: Verify build output
        run: |
          echo "Verifying build output..."
          ls build/
          if [ ! -f build/md-editor-*.exe ]; then
            echo "Executable not found!"
            exit 1
          fi

      - name: Create Release (exe)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}
