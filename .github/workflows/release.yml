name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt install qtbase5-dev qtwebengine5-dev
      - name: Build packages
        run: bash scripts/package.sh build
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/md-editor-*.deb
            build/md-editor-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
