name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtwebengine5-dev qtwebengine5-dev-tools libqt5webchannel5-dev imagemagick

      - name: Convert icon svg -> png -> ico
        run: |
          mkdir -p src/resources
          convert src/resources/icon.svg src/resources/icon.png
          convert src/resources/icon.svg src/resources/icon.ico || true

      - name: Build and package (deb)
        run: |
          bash scripts/build.sh build

      - name: Create Release (deb)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-librsvg
          update: true

      - name: Ensure icon.ico
        run: |
          cd ${GITHUB_WORKSPACE}
          if [ ! -f src/resources/icon.ico ]; then
            magick src/resources/icon.svg src/resources/icon.ico
          fi

      - name: Install Qt 5.15.2 (mingw81_64) with WebEngine
        env:
          QT_VERSION: 5.15.2
          QT_ARCH: win64_mingw81
        run: |
          cd ${GITHUB_WORKSPACE}
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall
          python3 -m aqt install-qt windows desktop ${QT_VERSION} ${QT_ARCH} --modules qtwebengine qtwebchannel -O ${GITHUB_WORKSPACE}/qt
          echo "Qt5_DIR=${GITHUB_WORKSPACE}/qt/${QT_VERSION}/mingw81_64/lib/cmake/Qt5" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/qt/${QT_VERSION}/mingw81_64/lib/cmake" >> $GITHUB_ENV
          echo "PATH=${GITHUB_WORKSPACE}/qt/${QT_VERSION}/mingw81_64/bin:$PATH" >> $GITHUB_ENV

      - name: Build and package (NSIS)
        env:
          GENERATOR: "Ninja"
          PATH: /mingw64/bin:${PATH}
        run: |
          cd ${GITHUB_WORKSPACE}
          bash scripts/build.sh build

      - name: Create Release (exe)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}
