name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtwebengine5-dev qtwebengine5-dev-tools libqt5webchannel5-dev imagemagick

      - name: Convert icon svg -> png -> ico
        run: |
          mkdir -p src/resources
          convert src/resources/icon.svg src/resources/icon.png
          convert src/resources/icon.svg src/resources/icon.ico || true

      - name: Build and package (deb)
        run: |
          bash scripts/build.sh build

      - name: Create Release (deb)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-webengine
            mingw-w64-x86_64-qt5-webchannel
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-librsvg
          update: true

      - name: Ensure icon.ico
        run: |
          cd ${GITHUB_WORKSPACE}
          if [ ! -f src/resources/icon.ico ]; then
            magick src/resources/icon.svg src/resources/icon.ico
          fi

      - name: Build and package (NSIS)
        env:
          GENERATOR: "Ninja"
          PATH: /mingw64/bin:${PATH}
          CMAKE_PREFIX_PATH: /mingw64/lib/cmake
        run: |
          cd ${GITHUB_WORKSPACE}
          bash scripts/build.sh build

      - name: Create Release (exe)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/md-editor-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.MD }}
